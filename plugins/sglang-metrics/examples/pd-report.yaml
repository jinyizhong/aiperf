# SPDX-License-Identifier: Apache-2.0
schema_version: 1
title: SGLang P/D 实验监控
# These URLs must match the exporter endpoints passed to --server-metrics.
# List EACH worker directly; a load-balancing Service can alternate backends.
endpoints:
  - url: http://prefill-0:8000/metrics
    role: prefill
    name: p0
  - url: http://decode-0:8000/metrics
    role: decode
    name: d0
max_series: 1000
max_points: 20000
# Optional names below are illustrative custom instrumentation, NOT SGLang defaults.
# They are only displayed when the server actually exports them.
metrics:
  pd_gather_seconds:
    title: Gather 耗时（自定义埋点）
    group: transfer
    unit: ms
    scale: 1000
  pd_rdma_seconds:
    title: RDMA 耗时（自定义埋点）
    group: transfer
    unit: ms
    scale: 1000
  pd_scatter_seconds:
    title: Scatter 耗时（自定义埋点）
    group: transfer
    unit: ms
    scale: 1000
  pd_staging_wait_seconds:
    title: Staging 等待（自定义埋点）
    group: transfer
    unit: ms
    scale: 1000
